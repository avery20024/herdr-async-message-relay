name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Check pinned version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$(tr -d '\r\n' < VERSION)" = "$TAG"
      - run: make check
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux]
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sh scripts/package.sh '${{ matrix.os }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hrelay_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hrelay_*
          path: dist
          merge-multiple: true
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name 'hrelay_*.tar.gz' | wc -l | tr -d ' ')" = 4
          sha256sum hrelay_*.tar.gz > checksums.txt
          gh release create "$TAG" hrelay_*.tar.gz checksums.txt \
            --draft --verify-tag --title "$TAG" --generate-notes
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" = 5
          gh release edit "$TAG" --draft=false
